name: Auto Cierre Temple

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # Cada domingo a las 00:00

jobs:
  auto-cierre:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh
      
      - name: Ejecutar auto_cierre_temple.py
        run: |
          python3 temple/auto_cierre_temple.py
      
      - name: Commit cambios
        run: |
          git config --local user.email 'actions@github.com'
          git config --local user.name 'GitHub Actions'
          git add temple/ docs/infra/madre/
          git commit -m "docs: Auto-cierre Temple" || echo "No changes"
          git pull --rebase
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
