name: Monitor New Files

on:
  push:
    paths:
      - 'docs/infra/madre/**'
  schedule:
    - cron: '0 * * * *'  # Cada hora

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Monitor new files
        run: |
          cd docs/infra/madre
          python3 scripts/monitor-new-files.py
      
      - name: Commit changes
        run: |
          git config --local user.email 'actions@github.com'
          git config --local user.name 'GitHub Actions'
          git add docs/infra/madre/
          git commit -m "docs: Auto-update after new files" || echo "No changes"
          git pull --rebase
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
