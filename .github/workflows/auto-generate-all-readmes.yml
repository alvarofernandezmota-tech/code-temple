name: Auto-Generate All READMEs

on:
  push:
    paths:
      - 'docs/infra/madre/**/*.md'
  workflow_dispatch:

jobs:
  generate-sesiones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Generate Sesiones README
        run: |
          cd docs/infra/madre/sesiones
          python3 scripts/generate_index.py
      - name: Commit
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add docs/infra/madre/sesiones/README.md
          git commit -m "docs: Auto-generate sesiones README" || echo "No changes"
          git push

  generate-adr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Generate ADR README
        run: |
          cd docs/infra/madre/adr
          python3 scripts/generate_index.py
      - name: Commit
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add docs/infra/madre/adr/README.md
          git commit -m "docs: Auto-generate ADR README" || echo "No changes"
          git push
