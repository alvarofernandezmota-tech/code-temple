name: Auto Cierre de Madre

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'  # Cada día a las 23:00

jobs:
  auto-cierre:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Ejecutar auto_cierre_madre.py
        run: |
          cd docs/infra/madre
          python3 automatizaciones/scripts/auto_cierre_madre.py
      
      - name: Commit cambios
        run: |
          git config --local user.email 'actions@github.com'
          git config --local user.name 'GitHub Actions'
          git add docs/infra/madre/
          git commit -m "docs: Auto-update Madre" || echo "No changes"
          git pull --rebase
          git push
