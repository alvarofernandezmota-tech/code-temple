name: Auto-Generate ADR README

on:
  push:
    paths:
      - 'docs/infra/madre/adr/*.md'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Generate README
        run: |
          cd docs/infra/madre/adr
          python3 scripts/generate_index.py
      
      - name: Commit
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add docs/infra/madre/adr/README.md
          git commit -m "docs: Auto-generate ADR README" || echo "No changes"
          git push
